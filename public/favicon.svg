    stroke="#1a1a1a"
    stroke-width="22"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <path
    d="M148 256
       C148 256 220 242 256 202
       C292 242 364 256 364 256
       C364 256 292 270 256 310
       C220 270 148 256 148 256 Z"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="22"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Small plus (+) top-right -->
  <line x1="360" y1="158" x2="360" y2="194" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
  <line x1="342" y1="176" x2="378" y2="176" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>

  <!-- Small diamond bottom-left -->
